services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: novaai-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: novaai
      POSTGRES_USER: novaai
      POSTGRES_PASSWORD: novaai_dev_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: